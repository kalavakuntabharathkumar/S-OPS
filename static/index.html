<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SupportOps</title><link rel='stylesheet' href='/static/styles.css'></head><body><main><header><div><p>SUPPORT OPERATIONS</p><h1>SupportOps</h1><span>Technical ticket triage, troubleshooting and resolution workflow</span></div><div id='metrics'></div></header><section class='card'><h2>Create support ticket</h2><form id='ticketForm'><input id='title' placeholder='Ticket title' required><textarea id='description' placeholder='Describe the issue, error, impact, and reproduction steps' required></textarea><div><input id='requester' placeholder='Requester' value='internal-user'><select id='channel'><option>portal</option><option>email</option><option>chat</option><option>phone</option></select><select id='priority'><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select><input id='assignee' placeholder='Assignee' value='support-engineer'></div><button>Diagnose & create ticket</button></form><pre id='result'></pre></section><section class='card'><h2>Recent tickets</h2><div id='tickets'></div></section></main><script src='/static/app.js'></script></body></html>
